<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Role-Based Asset Transaction and Approval Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text-muted);">
    <div style="text-align: center;">
      <div class="spinner" style="border-top-color: var(--primary-color); width: 32px; height: 32px; border-width: 3px;"></div>
      <p style="margin-top: 16px; font-weight: 500;">Redirecting...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
